# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.
# Repo-relative: TOML paths resolve against the detected project root (the
# nearest ancestor with .git / .gitignore / CMakeLists.txt), not the working
# directory, so this holds when the exe runs from build-release/.

[game]
name = "BreathOfFire3"
id = "SLPS-00990"
players = 1
exe = "disc/SLPS_009.90"
# /isos/ is gitignored -- the dump itself is never committed.
disc = "isos/Breath of Fire III (Japan).cue"
load_address = "0x80093800"
entry_pc = "0x8014AA0C"
text_size = "0x00163800"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Breath of Fire III (Japan).bin"
cue_name = "Breath of Fire III (Japan).cue"
boot_exe = "SLPS_009.90"
known_sizes = [479812704]
known_md5 = [
  "cb8d17ce72fc697fed6ddee7b3fde10b",
]
known_sha1 = [
  "ee7b20316590b61352868ca4d76f0a5f95c990de",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Script localization hook (docs/LOCALIZATION_APPLY.md): the recompiler emits
# psx_mod_function_entry() at the entry of MsgBox_Reset 0x8015042C, where the
# resolver has just stored the message pointer into 0x801490A8/AC. The
# title plugin src/bof3_localize.c repoints both at a translated copy.
# Changing this list changes the overlay config hash -- recompile overlays.
mod_function_entry_funcs = ["0x8015042C"]

[runtime]
window_title = "BreathOfFire3 Recompiled"
memcard_dir = "saves"

# On-the-fly string translation (psxrecomp docs/STRING_TRANSLATION.md).
# This is the Japanese release (SLPS-00990); English is applied at runtime by
# text_xlate substituting into the game's own draw calls. The disc is never
# modified, so the [prepare_disc] digests above stay valid.
#
# The framework's own capture/apply hook never sees BoF3 dialogue (the string
# pointer is not a dispatch argument -- docs/TEXT_ENGINE.md "The resolver");
# the script is delivered by the MsgBox_Reset plugin instead, which reads the
# resolved language back from text_xlate, so this dropdown still governs it.
# `languages` drives the launcher's Localization dropdown.
[localization]
language = "en"
languages = [
    { code = "en", label = "English" },
    { code = "jp", label = "Japanese" },
    { code = "jp_ruby", label = "Japanese (Ruby)" },
    { code = "jp_ruby_all", label = "Japanese (Ruby, every word)" },
]

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
# SLPS-00990 predates the DualShock: its pad reader ignores a controller that
# answers poll id 0x73 (analog). Verified 2026-09-02 on the world-map savestate:
# Start opens the camp menu with a 0x41 pad and does nothing with 0x73. The
# launcher defaults every gamepad seat to Analog, so lock every seat digital.
default_mode = "digital"
lock_mode = true

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 2
required_disc_fp = "2489523d08dd1729c8448ab005f6b34313fc33cd89fd8a4dbcfb2f4eb874c691"
