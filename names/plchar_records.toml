#   file_id  0x27D + combo -> BIN/PLCHAR/PLP<combo>.EMI
#   entry    kind tableA = u32[0x801CD8F0 + combo*4] (jalr 0x801B46B0),
#            tableB = u32[0x801CD964 + combo*4] (jalr 0x801B3C78 / 0x801BE508),
#            slot[g][s] = the image's last six words, u32[2][3] indexed by u16[ctx+0x2C]

