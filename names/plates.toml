# names/plates.toml -- the place-name plates painted into the world maps' texture pages
# (docs/TEXT_TABLES.md "World-map plates").  Rectangles come from tools/plates.py plates
# (analysis/plates/plates.json); jp is a by-eye transcription of plates_sheet.png on
# 2026-09-05; en is the wiki glossary's Locations row where one exists.
#   area      the world-map AREA file the page belongs to (names/places.toml id)
#   x y w h   texel rectangle on the 8-bit page (section dest 0x0E001000, 1024 x 256), 14-row body
#   span      "W+N" when the plate wraps at texel 256 and continues at the next 16-row band
#   status    evidence = read off the decoded page; note says when the extractor clipped it

[meta]
generator = "scratch gen_plates_toml.py over tools/plates.py plates"
page_dest = "0x0E001000"
plate_heights = 14
plate_widths = [44, 60, 76]

