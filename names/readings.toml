# names/readings.toml -- chosen readings for words SudachiPy reads by convention
# rather than by context.  tools/build_ruby_script.py consults this before the
# dictionary; the reading is the whole word's kana (okurigana on the page is
# trimmed the same way as a dictionary reading).  The audit list of candidates:
#
#     python tools/build_ruby_script.py --bin-root D:\BoFIII\BIN --scope every \
#         --ambiguous analysis/ruby_ambiguous.txt
#
# An entry keys on the exact token surface, or on a verb's dictionary form
# (言う covers 言っ / 言わ / 言え; the kana tail is swapped for the conjugated
# one, so irregulars like 来る -> 来 need their own surface).  A surface key
# cannot separate context readings of one surface (何 = なに / なん); those
# stay with the dictionary.

[[reading]]
surface = "私"
reading = "わたし"
note = "SudachiDict's cheapest entry is ワタクシ; the script's speakers say わたし"

[[reading]]
surface = "言う"
reading = "いう"
note = "ゆう 59 times in the every-word audit; keyed on the dictionary form, so 言っ / 言わ / 言え follow"

# A phrase rule: `next` lists the token that must follow, `prev` lists text
# the line must end with just before the word (a suffix match, so it can
# span tokens: "旅の").  Context rules are tried before the plain entry for
# the same surface; with no plain entry the dictionary's reading stands
# (何だ / 何で / 何と stay なん).
[[reading]]
surface = "何"
reading = "なに"
next = ["を", "が", "も", "か", "に", "は", "から", "まで", "より", "って",
        "かしら", "し", "する", "やっ", "よ", "？", "！", "‥‥", "‥", "、", "。", ""]
note = "SudachiDict reads 何 as なん everywhere; before a particle it is なに"

[[reading]]
surface = "方"
reading = "かた"
prev = ["旅の", "若い"]
note = "the person sense; after の the dictionary favours ほう (direction), right for places and wrong for people"

# Coinages the lexicon does not hold (out-of-vocabulary, no reading at all).
[[reading]]
surface = "闘場"
reading = "とうじょう"
note = "Genmel's arena (羅王の闘場); 63 uses"

[[reading]]
surface = "闘都"
reading = "とうと"
note = "闘都ジンメル"

[[reading]]
surface = "兄者"
reading = "あにじゃ"
note = "兄者ーっ！ (AREA051)"

# Numerals: Sudachi's number handler reads 一 as いち and tokenizes the counter
# separately, losing the sokuon (一回戦 -> いっかいせん) and the native reading
# (一晩 -> ひとばん).  Counters listed are the ones the script uses.
[[reading]]
surface = "一"
reading = "いっ"
next = ["戦", "回", "回戦", "歩", "発", "本", "杯", "匹", "個", "週", "生", "切", "体", "軒", "度", "口", "足", "着", "枚", "気", "緒"]
note = "一回戦, 一戦, 一歩, 一発 (2026-09-10 OOV sweep)"

[[reading]]
surface = "一"
reading = "ひと"
next = ["晩", "月", "目", "言", "息", "口", "休", "安", "際", "筋", "粒", "声", "夏", "冬", "雨", "眠"]
note = "一晩 = ひとばん"
