# names/area_records.toml -- the field engine's entry records for AREA overlays,
# read off the disc by tools/loader_records.py (docs/OVERLAY_HEADERS.md "Loader records").
#   area        area number = index into the boot table 0x801802EC
#   descriptor  the 0x44-byte descriptor at the end of the area's 0x801F2C00 section
#   entry       a pc the engine jalr's into: kind = init (desc+0x40), handler[k] (u32[desc+0x3C][k]),
#               or hook[k] (GAME.EMI's 11-row Area_HookTable 0x801C8F54 / 0x801C95BC, descriptor = the row)
#   section     md5 of the code section (joins names/overlays.toml and the capture set)

