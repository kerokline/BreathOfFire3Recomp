# names/data.toml — human names for DATA that lives inside overlay images
# (tables, strings, templates), found where the static walk from a shared-band
# entry hit data instead of code. See docs/DATA_ISLANDS.md and
# tools/data_islands.py, which prints `name` next to the classified bytes.
#
#   overlay:  md5 of the section bytes, from names/overlays.toml
#   pc:       address of the data inside that overlay's resident image
#   kind:     ascii strings | jp text | pointer table | halfword table |
#             word table | zero fill | struct
#   status:   unnamed | hypothesis | evidence | verified
#   evidence: how the name was established (bytes read, cross-reference)

[[data]]
overlay = "b8cc1561528b84ba16fe96074dfee289"
pc = 0x801D0ED4
name = "SaveFile_NameTemplate"
kind = "ascii strings"
status = "evidence"
evidence = "bytes at START.EMI#8 +0x2D4 (2026-09-07): a pointer 0x801E4A54 then, at +0x2D8, \"BISLPS-00990BOF3%02d\" -- the memory-card file name (BI + SLPS-00990 + BOF3 + two-digit slot), matching the card files save_tool.py reads"

