# names/font_small.toml -- the game's own 8 x 8 kana font, read off the font sheet
# (BIN/ETC/ENDKANJI.EMI section 0, the single-byte page) 2026-09-12.
#
# It sits below the 12 px cells: page rows 168..215, 8 px pitch both ways -- a
# voiced kana keeps its dakuten on the cell's top row (168 + 8r), the body on
# rows 1..7 (2026-09-12: an origin of 169 cut every dakuten: もど drew as もと),
# 32 glyphs per row, transcribed from analysis/font/small_font_grid.png.
# The box mapper cannot address it (it only knows 12 px cells), so the
# furigana plugin re-points a reading glyph's quad at the small cell of the
# same kana: u = 8 * col, v = 168 + 8 * row (docs/FURIGANA.md "The 8 px font").
#
# rows[i] is one page row of 32 glyphs, left to right; a space is an empty
# or non-kana cell. tools/sync_small_font.py turns this into
# src/bof3_small_font.h, keyed by the single-byte kana code in names/font.toml.

page_y = 168
pitch = 8

rows = [
    "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみ",
    "むめもやゆよらりるれろわをんぁぃぅぇぉっゃゅょがぎぐげござじずぜ",
    "ぞだぢづでどばびぶべぼぱぴぷぺぽアイウエオカキクケコサシスセソタ",
    "チツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンァィ",
    "ゥェォッャュョガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ",
    "ヴー。、                            ",
]
