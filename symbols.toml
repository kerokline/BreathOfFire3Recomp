[[func]]
pc = 0x8017ED4C
name = "Rand"
emit = false
status = "confirmed"
note = "BIOS thunk: li t2,0xA0; jr t2; li t1,0x2F = A0:2F rand() (psx-spx), read from the disc EXE 2026-09-05. Result mod 8 indexes the damage-variance tables (0x801D0C7C, 0x801EAF50), &1 the +0/+1 base term, %100 the hit rolls; 30 call sites in BATTLE.EMI#3, 32 in #15. Ghidra needs it marked returning or every caller's decompile truncates here (tools/ghidra/seed_overlay.py)"

[[func]]
pc = 0x801629CC
name = "File_LoadRequest"
emit = false
status = "confirmed"
note = "Disc-file loader entry, a0 = file id (2026-09-08, read from the EXE): stores a0 at 0x80146464, buffer 0x800E4800 at 0x80146460, fills the 24-byte slot array 0x8014649C with 0xFF, then File_LBA(a0) via 0x80162B50 -> 0x80146674/0x80146804 and kicks the CD state machine (0x80146490 = 0 until done). The file id indexes the LBA table 0x80182DBC (tools/file_ids.py). Called with immediates from every overlay: game-mode dispatcher 0x8014EB20 passes 0x262 = GAME.EMI, 0x8014E9A0 passes 0x261 = FIRST.EMI, BATL_END/BATTLE pass 0x80143F00 + 0x2AB = AREA<n>.EMI, the battle engine passes u16[0x800B3538 + row*8] = a BMAGIC file (tools/magic_map.py). LIVE: cast_magic.json 2026-09-08 (file slot 1, Ryu+Nina, hold Up + Circle x6): File_LoadRequest store 0x801629F0 wrote file id 0x156 (MAGIC070) at f+336 and 0x170 (MAGIC100) at f+724, both with ra = 0x800AB160 inside Magic_LoadForAbility; the band header word 0x801EEC00 then went 0x142 -> 0x16E (MAGIC070's registry id) at f+362 and -> 0x186 (MAGIC100's) at f+744, written by CD_getsector 0x80177ACC from CdReadyCallback -- the section lands straight from the CD buffer, header first"

[[func]]
pc = 0x801636F0
name = "File_LoadDone"
emit = false
status = "confirmed"
note = "Returns 1 when the loader state byte 0x80146490 == 3 (2026-09-08, read from the EXE); every File_LoadRequest caller spins on it (0x8014EB30 loop before entering the game-mode overlay at 0x801D0C04)"

[[func]]
