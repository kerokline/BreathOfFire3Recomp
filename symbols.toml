emit = false
status = "confirmed"
note = "Flag_Toggle(bits, index) -> bits[index>>3] ^= 1 << (index&7) -- eleven instructions, disasm 2026-09-07 (tools/disasm_exe.py 8015BFE4:11); the xor sibling the Flag_Test note already pointed at"

