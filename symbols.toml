status = "confirmed"
note = "AbilityList_ForType(index, ability_id, working) -> pointer to one of four 10-slot lists inside a character record: base = 0x80144964 + index*0xA4 (persistent) or 0x80145F00 + index*0x140 (working, when a2 != 0); type = (byte at 0x801CB231 + ability_id*16) & 3 selects +0x5C / +0x66 / +0x70 / +0x7A. Called by AbilityList_Add 0x80165BCC, which then fills the first zero slot of ten. Disassembled 2026-09-05; the card1 saves show the lists populated (Momo +0x5C/+0x66, Teepo +0x70, Rei +0x70/+0x7A)"
