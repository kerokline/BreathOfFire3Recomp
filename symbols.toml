status = "confirmed"
note = "u32[0x80182DBC + file_id*4] (2026-09-08, read from the EXE): the disc LBA of file id. All 887 entries are exact LBAs of the disc directory in walk order (tools/file_ids.py verified 887/887); entry 0x125 = BIN/BMAGIC/MAGIC001.EMI, 0x2AB = BIN/WORLD00/AREA000.EMI, 0x262 = BIN/ETC/GAME.EMI"

